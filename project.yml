name: GrandMAResourceManager
options:
  bundleIdPrefix: com.mochizuki.grandmaresourcemanager
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_STYLE: Automatic
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    exactVersion: 0.9.2

targets:
  GrandMAResourceManager:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Sources
      - path: Resources
    dependencies:
      - package: Citadel
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Resource Manager for grandMA
        CFBundleName: Resource Manager for grandMA
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
    entitlements:
      path: App/GrandMAResourceManager.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_NAME: Resource Manager for grandMA
        PRODUCT_BUNDLE_IDENTIFIER: com.mochizuki.grandmaresourcemanager.GrandMAResourceManager
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
